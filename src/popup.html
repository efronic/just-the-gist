<!doctype html>
<html lang="en" data-theme="gistlight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Just the Gist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sigmar+One&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body
    class="w-[680px] h-[600px] overflow-hidden flex flex-row font-sans antialiased bg-surface text-token-text dark:text-token-text"
  >
    <!-- Main content area (left) -->
    <div class="flex-1 min-h-0 flex flex-col overflow-hidden" id="mainContent">
      <div class="p-3 flex-1 min-h-0 flex flex-col overflow-hidden" id="panelsWrapper">
        <!-- Summary Panel (fills body) -->
        <div
          id="summaryTabPanel"
          class="p-4 bg-surface rounded-md border border-token flex-1 min-h-0 overflow-hidden flex flex-col"
        >
          <div id="summaryTab" class="">
            <div id="apiSection" class="space-y-2" style="display: none">
              <label for="apiKey" class="block text-[11px] font-semibold mt-1 text-token-text"
                >Google Gemini API key</label
              >
              <input
                id="apiKey"
                type="password"
                placeholder="AIza..."
                class="w-full rounded-md border border-token bg-surface px-2.5 py-2 text-[11px] focus:border-primary focus:ring-primary"
              />
              <div class="flex items-center gap-2 mt-1">
                <button id="saveApi" class="gbtn !px-3 !py-1.5 !text-[11px]">
                  Save API settings
                </button>
                <span id="apiStatus" class="text-[10px] text-token-text-soft"></span>
              </div>
              <div class="text-[10px] text-token-text-soft break-all">
                You can also manage this in
                <a href="#" id="openOptions2" class="text-primary hover:underline">Options</a>.
              </div>
            </div>
            <!-- Old URL/controls removed: controls moved into sidebar -->
          </div>
          <div id="status" class="text-[10px] text-token-text-soft hidden"></div>
          <div
            id="output"
            class="hidden flex-1 min-h-0 overflow-auto rounded-md border border-token bg-surface-alt dark:bg-surface-alt p-4 text-[13px] leading-relaxed summary-body"
          ></div>
          <!-- Summary placeholder card -->
          <div
            id="summaryPlaceholder"
            class="card bg-surface-alt shadow-sm mt-2 border border-dashed border-token"
          >
            <div class="card-body p-4 text-center">
              <p class="text-[12px] text-token-text-faint">No summary available</p>
            </div>
          </div>
        </div>
        <!-- Transcript Panel (fills body) -->
        <div id="transcriptTabPanel" class="hidden flex-1 min-h-0 overflow-hidden">
          <div id="transcriptContainer" class="hidden flex-1 min-h-0">
            <div
              id="transcriptPreview"
              class="relative flex-1 min-h-0 overflow-y-auto scroll-smooth rounded-md border border-token bg-surface-alt dark:bg-surface-alt pb-3 text-[14px] leading-relaxed font-transcript gist-scrollbar transcript-body"
            >
              <div
                id="transcriptToolbar"
                class="sticky -top-px left-0 right-0 z-10 flex items-center gap-2 px-2 py-1.5 bg-surface-translucent border-b border-token"
              >
                <button
                  id="tbCopy"
                  class="tbtn tooltip tooltip-bottom"
                  data-tip="Copy"
                  aria-label="Copy transcript"
                >
                  <span class="sr-only">Copy transcript</span>
                  <svg
                    viewBox="0 0 24 24"
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                  >
                    <path
                      d="M6 11c0-2.828 0-4.243.879-5.121C7.757 5 9.172 5 12 5h3c2.828 0 4.243 0 5.121.879C21 6.757 21 8.172 21 11v5c0 2.828 0 4.243-.879 5.121C19.243 22 17.828 22 15 22h-3c-2.828 0-4.243 0-5.121-.879C6 20.243 6 18.828 6 16v-5Z"
                    />
                    <path
                      d="M6 19c-1.657 0-3-1.343-3-3v-6c0-3.771 0-5.657 1.172-6.828C5.343 2 7.229 2 11 2h4c1.657 0 3 1.343 3 3"
                    />
                  </svg>
                </button>
                <button
                  id="tbCopyTs"
                  class="tbtn tooltip tooltip-bottom"
                  data-tip="Copy +TS"
                  aria-label="Copy with timestamps"
                >
                  <span class="sr-only">Copy with timestamps</span>
                  <svg
                    viewBox="0 0 24 24"
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M22 11.1V6.9C22 3.4 20.6 2 17.1 2h-4.2C9.4 2 8 3.4 8 6.9V8h3.1c3.5 0 4.9 1.4 4.9 4.9V16h1.1c3.5 0 4.9-1.4 4.9-4.9Z"
                    />
                    <path
                      d="M16 17.1v-4.2c0-3.5-1.4-4.9-4.9-4.9H6.9C3.4 8 2 9.4 2 12.9v4.2C2 20.6 3.4 22 6.9 22h4.2c3.5 0 4.9-1.4 4.9-4.9Z"
                    />
                    <path d="M6.08 15 8.03 16.95 11.92 13.05" />
                  </svg>
                </button>
                <button
                  id="tbDownload"
                  class="tbtn tooltip tooltip-bottom"
                  data-tip="Download"
                  aria-label="Download transcript"
                >
                  <span class="sr-only">Download transcript</span>
                  <svg
                    viewBox="0 0 24 24"
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M17 9c2.175.012 3.353.109 4.121.878C22 10.757 22 12.172 22 15v1c0 2.829 0 4.243-.879 5.122C20.243 22 18.828 22 16 22H8c-2.828 0-4.243 0-5.122-.878C2 20.243 2 18.829 2 16v-1c0-2.828 0-4.243.879-5.122C3.647 9.11 4.825 9.012 7 9"
                    />
                    <path d="M12 2v13m0 0L9 11.5M12 15l3-3.5" />
                  </svg>
                </button>
                <button
                  id="tbExpand"
                  class="tbtn tooltip tooltip-bottom"
                  data-tip="Expand"
                  aria-label="Expand transcript"
                  aria-pressed="false"
                >
                  <span class="sr-only">Expand transcript</span>
                  <svg
                    viewBox="0 0 24 24"
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M15 9 21 3h-6v6Zm-6 0V3H3l6 6Zm0 6-6 6h6v-6Zm6 0v6h6l-6-6Z" />
                  </svg>
                </button>
                <button
                  id="tbToggleTs"
                  class="tbtn tooltip tooltip-bottom"
                  data-tip="Timestamps"
                  aria-pressed="true"
                  aria-label="Toggle timestamps"
                >
                  <span class="sr-only">Toggle timestamps</span>
                  <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor">
                    <path d="M3.5 7.5A1.5 1.5 0 1 0 3.5 4.5a1.5 1.5 0 0 0 0 3Z" />
                    <path d="M8 5a1 1 0 0 0 0 2h13a1 1 0 1 0 0-2H8Z" />
                    <path d="M8 11a1 1 0 0 0 0 2h13a1 1 0 1 0 0-2H8Z" />
                    <path d="M7 18a1 1 0 0 1 1-1h13a1 1 0 1 1 0 2H8a1 1 0 0 1-1-1Z" />
                    <path d="M5 12a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
                    <path d="M3.5 19.5A1.5 1.5 0 1 0 3.5 16.5a1.5 1.5 0 0 0 0 3Z" />
                  </svg>
                </button>
                <button
                  id="tbCompact"
                  class="tbtn tooltip tooltip-bottom"
                  data-tip="Compact"
                  aria-pressed="false"
                  aria-label="Compact mode"
                >
                  <span class="sr-only">Compact mode</span>
                  <svg
                    viewBox="0 0 64 64"
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linejoin="bevel"
                    stroke-miterlimit="10"
                  >
                    <polyline points="25,19 32,26 39,19" />
                    <line x1="32" y1="26" x2="32" y2="0" />
                    <polyline points="39,45 32,38 25,45" />
                    <line x1="32" y1="38" x2="32" y2="64" />
                  </svg>
                </button>
                <div
                  id="transcriptMetaMini"
                  class="hidden md:block text-[10px] text-token-text-faint whitespace-nowrap"
                ></div>
                <div class="relative ml-auto min-w-[140px] w-full h-full max-w-[50%]">
                  <label for="transcriptSearch" class="sr-only">Search transcript</label>
                  <input
                    id="transcriptSearch"
                    type="search"
                    placeholder="Search…"
                    class="input input-bordered w-full"
                  />
                </div>
              </div>
              <div id="transcriptContent" class="space-y-0 px-3 pb-3 pt-2"></div>
            </div>
            <div id="transcriptMeta" class="text-[11px] text-token-text-faint mt-1"></div>
          </div>
          <!-- Transcript placeholder card -->
          <div
            id="transcriptPlaceholder"
            class="card bg-surface-alt shadow-sm mt-2 border border-dashed border-token"
          >
            <div class="card-body p-4 text-center">
              <p class="text-[12px] text-token-text-faint">
                No transcript available. For non-video pages, a transcript may not exist.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right vertical sidebar -->
  <aside id="sidebar" class="w-60 h-full border-l border-token bg-surface flex flex-col auto-hide">
      <!-- Brand + theme -->
      <div class="px-3 py-3 border-b border-token flex items-center justify-between sidebar-header">
        <div class="sigmar-one-regular text-sm tracking-tight label">Just the Gist</div>
        <button id="themeToggle" type="button" class="btn btn-ghost btn-xs" title="Toggle theme">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 48 48"
            class="w-4 h-4"
            fill="currentColor"
            aria-hidden="true"
          >
            <path d="M14 24a10 10 0 0 0 10 10V14a10 10 0 0 0-10 10Z" />
            <path
              d="M24 2a22 22 0 1 0 22 22A21.9 21.9 0 0 0 24 2Zm18 22A18.1 18.1 0 0 1 24 42v-8a10 10 0 0 1 0-20V6A18.1 18.1 0 0 1 42 24Z"
            />
          </svg>
        </button>
      </div>

      <!-- Nav buttons -->
      <div class="p-3 space-y-2">
        <button
          id="navSummary"
          class="btn btn-ghost btn-sm w-full justify-start"
          aria-pressed="true"
        >
          <svg viewBox="0 0 24 24" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="label">Summary</span>
        </button>
        <!-- Summary config (expands under Summary) -->
        <div id="summaryConfig" class="mt-2 space-y-2">
          <div>
            <label for="mode" class="block text-[11px] mb-1">Mode</label>
            <select id="mode" class="select select-bordered select-sm w-full">
              <option value="auto" selected>Auto</option>
              <option value="page">Page</option>
              <option value="video">Video</option>
            </select>
          </div>
          <div>
            <label for="detailLevelSelect" class="block text-[11px] mb-1">Detail level</label>
            <select id="detailLevelSelect" class="select select-bordered select-sm w-full">
              <option value="concise">Concise</option>
              <option value="standard" selected>Standard</option>
              <option value="detailed">Detailed</option>
              <option value="expanded">Expanded</option>
            </select>
          </div>
          <button id="summarizeBtn" class="btn btn-primary btn-sm w-full font-semibold tracking-tight shadow-sm">
            <svg viewBox="0 0 24 24" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            <span class="label">Summarize</span>
          </button>
        </div>

        <button
          id="navTranscript"
          class="btn btn-ghost btn-sm w-full justify-start"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h16v10H7l-3 3V5z"/></svg>
          <span class="label">Transcript</span>
        </button>
      </div>

      <div class="mt-auto p-3 border-t border-token space-y-2">
        <button id="navCopyUrl" class="btn btn-outline btn-sm w-full justify-start">
          <svg viewBox="0 0 24 24" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="label">Copy page URL</span>
        </button>
      </div>
    </aside>

    <script type="module" src="popup.js"></script>
  </body>
</html>
